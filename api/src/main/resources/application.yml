server:
  port: ${PORT:8080}

spring:
  application:
    name: portfolio-api
  datasource:
    hikari:
      # Neon's free tier allows few connections and suspends when idle.
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 60000 # ms
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # The CV is the only upload.
      max-file-size: 5MB
      max-request-size: 6MB

portfolio:
  security:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password-hash: ${ADMIN_PASSWORD_HASH:}
    jwt-secret: ${JWT_SECRET:}
    token-ttl: 8h
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5174}
