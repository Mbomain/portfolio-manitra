# Render Blueprint: the portfolio API as a Docker web service.
# Values marked "sync: false" are asked for in the Render dashboard and never stored in git.
services:
  - type: web
    name: portfolio-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/portfolio
    autoDeploy: true
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://manitra-portfolio.vercel.app,https://manitra-portfolio-admin.vercel.app
